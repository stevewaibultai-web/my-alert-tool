<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Crypto Price Test</title>
</head>
<body style="background:#0b1426; color:#fff; font-family:Segoe UI; text-align:center; padding:50px;">
  <h2>Crypto Price Test</h2>
  <div id="price" style="font-size:20px; color:#0ecb81;">Loading...</div>

  <script>
    async function fetchPrice(symbol="BTCUSDT") {
      try {
        const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
        const data = await res.json();
        if(data.price) {
          document.getElementById("price").innerText = symbol + " : $" + parseFloat(data.price).toLocaleString();
        }
      } catch(e) {
        document.getElementById("price").innerText = "Error fetching price";
      }
    }

    // Run once at start
    fetchPrice();

    // Update every 5 seconds
    setInterval(() => fetchPrice(), 5000);
  </script>
</body>
</html>
