<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Trading Alert System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b1426; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        h3 { text-align: center; color: #38a1f3; margin-bottom: 20px; font-weight: 500; }
        .config-box { background: #132240; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #1c3563; }
        input, select, button { background: #1b2e54; color: #fff; border: 1px solid #2d4b85; padding: 10px; margin: 6px 0; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
        button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; }
        .price-card { background: #132240; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #1c3563; display: flex; justify-content: space-between; align-items: center; }
        .price-card.disabled { opacity: 0.4; }
        .symbol-info { display: flex; flex-direction: column; width: 30%; }
        .symbol-name { font-weight: bold; font-size: 15px; text-transform: uppercase; padding: 4px; }
        .market-src { font-size: 11px; color: #8fa0c2; margin-top: 2px; margin-left: 4px; }
        .controls { display: flex; gap: 4px; width: 45%; }
        .controls select { padding: 6px; font-size: 12px; }
        .status-select { background: #2b1b34 !important; font-weight: bold; }
        .status-select.active-mode { background: #1b382b !important; color: #0ecb81; }
        .price-display { width: 25%; text-align: right; font-size: 14px; font-weight: bold; color: #0ecb81; }
        .status-text { font-size: 12px; text-align: center; margin-top: 5px; color: #0ecb81; }
    </style>
</head>
<body>

<div class="container">
    <h3>Telegram Alert Configuration</h3>
    <div class="config-box">
        <input type="text" id="botToken" placeholder="Bot Token">
        <input type="text" id="chatId" placeholder="Chat ID">
        <button onclick="testTelegram()">Test Connection</button>
        <div id="status" class="status-text"></div>
    </div>

    <h4 style="color: #8fa0c2; margin-left: 5px; margin-bottom: 10px;">Price Table</h4>
    <div id="dashboard">
        <!-- Row 0 -->
        <div class="price-card" id="card0">
            <div class="symbol-info">
                <input type="text" value="BTCUSDT" id="sym0" class="symbol-name" onchange="initRow(0)">
                <span id="src0" class="market-src">Binance (Crypto)</span>
            </div>
            <div class="controls">
                <select id="ind0"><option>MACD</option><option>EMA</option><option>RSI</option></select>
                <select id="tf0"><option>15m</option><option>1m</option><option>5m</option></select>
                <select id="status0" class="status-select active-mode" onchange="toggleRow(0)"><option value="ON">ON</option><option value="OFF">OFF</option></select>
            </div>
            <div id="price0" class="price-display">Loading...</div>
        </div>
        <!-- Row 1 -->
        <div class="price-card" id="card1">
            <div class="symbol-info">
                <input type="text" value="ETHUSDT" id="sym1" class="symbol-name" onchange="initRow(1)">
                <span id="src1" class="market-src">Binance (Crypto)</span>
            </div>
            <div class="controls">
                <select id="ind1"><option>EMA</option><option>MACD</option><option>RSI</option></select>
                <select id="tf1"><option>30m</option><option>5m</option></select>
                <select id="status1" class="status-select active-mode" onchange="toggleRow(1)"><option value="ON">ON</option><option value="OFF">OFF</option></select>
            </div>
            <div id="price1" class="price-display">Loading...</div>
        </div>
        <!-- Row 2 -->
        <div class="price-card" id="card2">
            <div class="symbol-info">
                <input type="text" value="NSE:RELIANCE" id="sym2" class="symbol-name" onchange="initRow(2)">
                <span id="src2" class="market-src">NSE India</span>
            </div>
            <div class="controls">
                <select id="ind2"><option>RSI</option><option>MACD</option></select>
                <select id="tf2"><option>1h</option><option>15m</option></select>
                <select id="status2" class="status-select active-mode" onchange="toggleRow(2)"><option value="ON">ON</option><option value="OFF">OFF</option></select>
            </div>
            <div id="price2" class="price-display">Loading...</div>
        </div>
        <!-- Row 3 -->
        <div class="price-card" id="card3">
            <div class="symbol-info">
                <input type="text" value="NSE:TCS" id="sym3" class="symbol-name" onchange="updateRowSource(3)">
                <span id="src3" class="market-src">NSE India</span>
            </div>
            <div class="controls">
                <select id="ind3"><option>MACD</option><option>RSI</option></select>
                <select id="tf3"><option>4h</option><option>1d</option></select>
                <select id="status3" class="status-select active-mode" onchange="toggleRow(3)"><option value="ON">ON</option><option value="OFF">OFF</option></select>
            </div>
            <div id="price3" class="price-display">Loading...</div>
        </div>
    </div>
</div>

<script>
    let sockets = {};

    function toggleRow(i) {
        const statusBox = document.getElementById(`status${i}`);
        const card = document.getElementById(`card${i}`);
        if(statusBox.value === "OFF") {
            card.classList.add("disabled");
            statusBox.classList.remove("active-mode");
            if(sockets[i]) { sockets[i].close(); sockets[i] = null; }
            document.getElementById(`price${i}`).innerText = "OFF";
        } else {
            card.classList.remove("disabled");
            statusBox.classList.add("active-mode");
            initRow(i);
        }
    }

    function initRow(i) {
        if(document.getElementById(`status${i}`).value === "OFF") return;
        let sym = document.getElementById(`sym${i}`).value.toUpperCase().trim();
        const srcLabel = document.getElementById(`src${i}`);
        
        if(sockets[i]) { sockets[i].close(); sockets[i] = null; }

        if(sym.startsWith("NSE:") || sym.startsWith("BSE:")) {
            srcLabel.innerText = "NSE India (Stock)";
            fetchStockPrice(i, sym.replace("NSE:", "").replace("BSE:", ""));
        } else {
            srcLabel.innerText = "Binance (Crypto)";
            connectCryptoWS(i, sym);
        }
    }

    function connectCryptoWS(i, symbol) {
        try {
            sockets[i] = new WebSocket(`wss://://binance.com{symbol.toLowerCase()}@ticker`);
            sockets[i].onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.c) {
                    document.getElementById(`price${i}`).innerText = `$ ${parseFloat(data.c).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                }
            };
        } catch(e) { document.getElementById(`price${i}`).innerText = "WS Error"; }
    }

    async function fetchStockPrice(i, ticker) {
        if(document.getElementById(`status${i}`).value === "OFF") return;
        try {
            // Using a CORS-free open proxy feed for Indian Stocks
            const res = await fetch(`https://yahoo.com{ticker}.NS`);
            const data = await res.json();
            const price = data.chart.result[0].meta.regularMarketPrice;
            if(price) {
                document.getElementById(`price${i}`).innerText = `₹ ${parseFloat(price).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            }
        } catch(e) { document.getElementById(`price${i}`).innerText = "API Error"; }
        // Refresh stock price every 10 seconds
        setTimeout(() => fetchStockPrice(i, ticker), 10000);
    }

    function testTelegram() {
        const token = document.getElementById('botToken').value.trim();
        const chat = document.getElementById('chatId').value.trim();
        const statusDiv = document.getElementById('status');
        if(!token || !chat) { statusDiv.innerText = "❌ Put Token and Chat ID!"; return; }
        fetch(`https://telegram.org{token}/sendMessage?chat_id=${chat}&text=🔔 Connection Successful!`)
        .then(res => res.json()).then(data => {
            if(data.ok) statusDiv.innerText = "✅ Connected Successfully!";
            else statusDiv.innerText = "❌ Invalid Credentials.";
        }).catch(() => statusDiv.innerText = "❌ Error.");
    }

    window.onload = function() { for(let i=0; i<4; i++) { initRow(i); } };
</script>
</body>
</html>
