<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Alert Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0b1426; color: #fff; padding: 15px; margin: 0; }
    .container { max-width: 500px; margin: 0 auto; }
    h3 { text-align: center; color: #38a1f3; margin-bottom: 20px; font-weight: 500; }
    .config-box { background: #132240; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #1c3563; }
    input, button { background: #1b2e54; color: #fff; border: 1px solid #2d4b85; padding: 10px; margin: 6px 0; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
    button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; }
    .price-card { background: #132240; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #1c3563; display: flex; justify-content: space-between; align-items: center; }
    .price-card.disabled { opacity: 0.4; }
    .symbol-info { display: flex; flex-direction: column; width: 30%; }
    .symbol-name { font-weight: bold; font-size: 15px; text-transform: uppercase; padding: 4px; border: none; background: transparent; color: #fff; width: 100%; }
    .market-src { font-size: 11px; color: #8fa0c2; margin-top: 2px; margin-left: 4px; }
    .controls { display: flex; gap: 4px; width: 45%; }
    .controls select { padding: 6px; font-size: 12px; background: #1b2e54; color: #fff; border: 1px solid #2d4b85; border-radius: 4px; }
    .status-select { background: #2b1b34 !important; font-weight: bold; }
    .status-select.active-mode { background: #1b382b !important; color: #0ecb81; }
    .price-display { width: 25%; text-align: right; font-size: 14px; font-weight: bold; color: #0ecb81; }
    .status-text { font-size: 12px; text-align: center; margin-top: 5px; color: #0ecb81; }
  </style>
</head>
<body>
<div class="container">
  <h3>Telegram Alert Configuration</h3>
  <div class="config-box">
    <input type="text" id="botToken" placeholder="Bot Token">
    <input type="text" id="chatId" placeholder="Chat ID">
    <button onclick="testTelegram()">Test Connection</button>
    <div id="status" class="status-text"></div>
  </div>
  <h4 style="color: #8fa0c2; margin-left: 5px; margin-bottom: 10px;">Price Table</h4>
  <div id="dashboard">
    <!-- 4 rows -->
    <div class="price-card" id="card0">
      <div class="symbol-info">
        <input type="text" value="BTCUSDT" id="sym0" class="symbol-name" onchange="initRow(0)">
        <span id="src0" class="market-src">Binance Futures</span>
      </div>
      <div class="controls">
        <select id="ind0"><option>MACD</option></select>
        <select id="tf0"><option>1m</option><option>3m</option><option>5m</option><option>15m</option><option>30m</option></select>
        <select id="status0" class="status-select active-mode" onchange="toggleRow(0)"><option value="ON">ON</option><option value="OFF">OFF</option></select>
      </div>
      <div id="price0" class="price-display">Loading...</div>
    </div>
    <!-- Repeat for ETHUSDT, RELIANCE, TCS -->
    <!-- ... same structure with id sym1, sym2, sym3 -->
  </div>
</div>
<script>
  let intervals = {};
  function toggleRow(i) {
    const statusBox = document.getElementById(`status${i}`);
    const card = document.getElementById(`card${i}`);
    if(statusBox.value === "OFF") {
      card.classList.add("disabled");
      statusBox.classList.remove("active-mode");
      if(intervals[i]) { clearInterval(intervals[i]); intervals[i] = null; }
      document.getElementById(`price${i}`).innerText = "OFF";
    } else {
      card.classList.remove("disabled");
      statusBox.classList.add("active-mode");
      initRow(i);
    }
  }
  async function initRow(i) {
    if(document.getElementById(`status${i}`).value === "OFF") return;
    let sym = document.getElementById(`sym${i}`).value.toUpperCase().trim();
    const srcLabel = document.getElementById(`src${i}`);
    if(intervals[i]) clearInterval(intervals[i]);

    if(sym === "RELIANCE" || sym === "TCS" || sym.includes("NSE")) {
      let ticker = sym.replace("NSE:", "") + ".NS";
      srcLabel.innerText = "NSE India (Stock)";
      fetchStock(i, ticker);
      intervals[i] = setInterval(() => fetchStock(i, ticker), 5000);
    } else {
      srcLabel.innerText = "Binance Futures";
      fetchCrypto(i, sym);
      intervals[i] = setInterval(() => fetchCrypto(i, sym), 3000);
    }
  }
  async function fetchCrypto(i, symbol) {
    try {
      const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
      const data = await res.json();
      if(data.price) document.getElementById(`price${i}`).innerText = `$ ${parseFloat(data.price).toLocaleString(undefined, {minimumFractionDigits:2})}`;
    } catch(e) { document.getElementById(`price${i}`).innerText = "Error"; }
  }
  async function fetchStock(i, ticker) {
    try {
      const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`);
      const data = await res.json();
      const price = data.chart.result[0].meta.regularMarketPrice;
      if(price) document.getElementById(`price${i}`).innerText = `₹ ${parseFloat(price).toLocaleString('en-IN', {minimumFractionDigits:2})}`;
    } catch(e) { document.getElementById(`price${i}`).innerText = "Error"; }
  }
  function testTelegram() {
    const token = document.getElementById('botToken').value.trim();
    const chat = document.getElementById('chatId').value.trim();
    const statusDiv = document.getElementById('status');
    fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=🔔 Test Message from Dashboard!`)
    .then(res => res.json()).then(data => {
      if(data.ok) statusDiv.innerText = "✅ Test Notification Sent!";
      else statusDiv.innerText = "❌ Check Token/ID";
    }).catch(() => statusDiv.innerText = "❌ Network Error");
  }
  window.onload = function() { for(let i=0; i<4; i++) { initRow(i); } };
</script>
</body>
</html>
