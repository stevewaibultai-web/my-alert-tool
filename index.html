  function sendTelegramAlert(i, msg="Alert", tf="1m") {
    let sym = document.getElementById(`sym${i}`).value;
    let timeframe = document.getElementById(`tf${i}`).value;
    let now = new Date();
    let timeStr = now.toLocaleTimeString("en-IN", { hour12: false });
    let fullMsg = `${msg}: ${sym} | TF: ${timeframe} | Candle Close: ${timeStr}`;
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(fullMsg)}`);
  }

  async function fetchCandles(symbol, tf="1m") {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=200`);
    const data = await res.json();
    return data.map(c => parseFloat(c[4])); // closing prices
  }

  function EMA(values, period) {
    let k = 2/(period+1);
    let emaArray = [];
    emaArray[0] = values[0];
    for(let i=1;i<values.length;i++){
      emaArray[i] = values[i]*k + emaArray[i-1]*(1-k);
    }
    return emaArray;
  }

  function SMA(values, period) {
    let result = [];
    for(let i=0;i<values.length;i++){
      if(i<period) result.push(values[i]);
      else {
        let sum=0;
        for(let j=i-period+1;j<=i;j++) sum+=values[j];
        result.push(sum/period);
      }
    }
    return result;
  }

  async function checkMACD(i, symbol, tf="1m") {
    let closes = await fetchCandles(symbol, tf);
    if(closes.length < 30) return;

    let ema12 = EMA(closes, 12);
    let ema26 = EMA(closes, 26);
    let macdLine = ema12.map((v, idx) => v - ema26[idx]);
    let signalLine = EMA(macdLine, 9);

    let lastMacd = macdLine[macdLine.length-1];
    let prevMacd = macdLine[macdLine.length-2];
    let lastSignal = signalLine[signalLine.length-1];
    let prevSignal = signalLine[signalLine.length-2];

    if(prevMacd < prevSignal && lastMacd > lastSignal) {
      sendTelegramAlert(i, "MACD Bullish Crossover", tf);
    } else if(prevMacd > prevSignal && lastMacd < lastSignal) {
      sendTelegramAlert(i, "MACD Bearish Crossover", tf);
    }
  }

  async function checkSMAAlerts(i, symbol, tf="1m") {
    let closes = await fetchCandles(symbol, tf);
    if(closes.length < 900) return;

    let blue = SMA(closes, 15);
    let orange = SMA(closes, 180);
    let purple = SMA(closes, 900);

    let lastBlue = blue[blue.length-1], prevBlue = blue[blue.length-2];
    let lastOrange = orange[orange.length-1], prevOrange = orange[orange.length-2];
    let lastPurple = purple[purple.length-1], prevPurple = purple[purple.length-2];

    // Blue vs Orange → Confirmation
    if((prevBlue < prevOrange && lastBlue > lastOrange) || (prevBlue > prevOrange && lastBlue < lastOrange)) {
      let msg = "Confirmation Alert | Blue crossed Orange";
      if(Math.abs(lastOrange - lastPurple) < 0.00001) {
        msg += " | Orange merged with Purple";
      }
      sendTelegramAlert(i, msg, tf);
    }

    // Orange vs Purple → Long Trend
    if((prevOrange < prevPurple && lastOrange > lastPurple) || (prevOrange > prevPurple && lastOrange < lastPurple)) {
      sendTelegramAlert(i, "Long Trend Alert | Orange crossed Purple", tf);
    }

    // Blue crosses both → Strong Trend
    let blueCrossOrange = (prevBlue < prevOrange && lastBlue > lastOrange) || (prevBlue > prevOrange && lastBlue < lastOrange);
    let blueCrossPurple = (prevBlue < prevPurple && lastBlue > lastPurple) || (prevBlue > prevPurple && lastBlue < lastPurple);
    if(blueCrossOrange && blueCrossPurple) {
      sendTelegramAlert(i, "Strong Trend Alert | Blue crossed Orange & Purple", tf);
    }
  }

  async function fetchCrypto(i, symbol, tf="1m") {
    try {
      const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
      const data = await res.json();
      if(data.price) {
        let price = parseFloat(data.price);
        document.getElementById(`price${i}`).innerText = `$ ${price.toLocaleString()}`;
      }
    } catch(e) {
      document.getElementById(`price${i}`).innerText = "Error";
    }
  }
