<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Alert Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0b1426; color: #fff; padding: 20px; margin: 0; }
    h2 { text-align: center; color: #38a1f3; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #1c3563; padding: 10px; text-align: center; }
    th { background: #132240; color: #8fa0c2; }
    td input { background: transparent; border: none; color: #fff; text-align: center; font-weight: bold; }
    select { background: #1b2e54; color: #fff; border: 1px solid #2d4b85; border-radius: 4px; padding: 5px; }
    .price { font-weight: bold; color: #0ecb81; }
    .market-info { background: #132240; padding: 15px; border-radius: 8px; }
    .market-info h3 { color: #38a1f3; margin-bottom: 10px; }
    .market-info ul { list-style: none; padding: 0; }
    .market-info li { margin: 5px 0; color: #8fa0c2; }
    .config-box { background: #132240; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; padding: 10px; border-radius: 6px; width: 100%; }
    .status-text { font-size: 12px; margin-top: 5px; color: #0ecb81; }
  </style>
</head>
<body>
  <h2>Trading Alert Dashboard</h2>

  <!-- Telegram Connection -->
  <div class="config-box">
    <button onclick="testTelegram()">Test Connection</button>
    <div id="status" class="status-text"></div>
  </div>

  <!-- Price Table -->
  <table>
    <tr>
      <th>Symbol</th>
      <th>Indicator</th>
      <th>Timeframe</th>
      <th>Current Price</th>
      <th>Alert</th>
    </tr>
    <tr>
      <td><input type="text" id="sym0" value="BTCUSDT" onchange="initRow(0)"></td>
      <td><select id="ind0"><option>MACD</option></select></td>
      <td><select id="tf0"><option>1m</option><option>5m</option><option>15m</option></select></td>
      <td id="price0" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(0)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym1" value="ETHUSDT" onchange="initRow(1)"></td>
      <td><select id="ind1"><option>MACD</option></select></td>
      <td><select id="tf1"><option>1m</option><option>5m</option><option>15m</option></select></td>
      <td id="price1" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(1)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym2" value="RELIANCE" onchange="initRow(2)"></td>
      <td><select id="ind2"><option>MACD</option></select></td>
      <td><select id="tf2"><option>1m</option><option>5m</option><option>15m</option></select></td>
      <td id="price2" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(2)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym3" value="TCS" onchange="initRow(3)"></td>
      <td><select id="ind3"><option>MACD</option></select></td>
      <td><select id="tf3"><option>1m</option><option>5m</option><option>15m</option></select></td>
      <td id="price3" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(3)">Send Alert</button></td>
    </tr>
  </table>

  <!-- Market Info -->
  <div class="market-info">
    <h3>Market Info</h3>
    <ul>
      <li>BTCUSDT: Binance (Crypto)</li>
      <li>ETHUSDT: Binance (Crypto)</li>
      <li>RELIANCE: NSE India (Stock)</li>
      <li>TCS: BSE India (Stock)</li>
    </ul>
  </div>

  <script>
  const BOT_TOKEN = "8910250156:AAFXETIQy7ILusg--h5FE1PKg-dLFgS7hpg"; 
  const CHAT_ID = "7287275405";

  // Telegram Alert Function
  function sendTelegramAlert(msg) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`);
  }

  // EMA Calculation
  function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let emaArray = [];
    emaArray[0] = prices[0];
    for(let i=1; i<prices.length; i++) {
      emaArray[i] = prices[i] * k + emaArray[i-1] * (1-k);
    }
    return emaArray;
  }

  // MACD Calculation
  function calculateMACD(prices) {
    let emaFast = calculateEMA(prices, 12);
    let emaSlow = calculateEMA(prices, 26);
    let macdLine = emaFast.map((val, i) => val - emaSlow[i]);
    let signalLine = calculateEMA(macdLine, 9);
    let histogram = macdLine.map((val, i) => val - signalLine[i]);
    return { macdLine, signalLine, histogram };
  }

// Crypto Price Fetch
async function fetchCrypto(i, symbol, tf="1m") {
  try {
    const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
    const data = await res.json();
    if(data.price) {
      let price = parseFloat(data.price);
      document.getElementById(`price${i}`).innerText = `$ ${price.toLocaleString()}`;
    }
  } catch(e) {
    document.getElementById(`price${i}`).innerText = "Error";
  }
}

// Stock Price Fetch
async function fetchStock(i, ticker) {
  try {
    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1m&range=1d`);
    const data = await res.json();
    let closes = data.chart.result[0].indicators.quote[0].close.filter(v => v != null);
    let lastPrice = closes[closes.length-1];
    if(lastPrice) {
      document.getElementById(`price${i}`).innerText = `₹ ${lastPrice.toLocaleString('en-IN')}`;
    } else {
      document.getElementById(`price${i}`).innerText = "Market Closed";
    }
  } catch(e) {
    document.getElementById(`price${i}`).innerText = "Error";
  }
}

// Row Initialization
let intervals = {};
function initRow(i) {
  let sym = document.getElementById(`sym${i}`).value.toUpperCase().trim();

  // Save symbol to localStorage
  localStorage.setItem(`symbol${i}`, sym);

  if(intervals[i]) clearInterval(intervals[i]);

  if(sym === "RELIANCE" || sym === "TCS") {
    let ticker = sym + ".NS";
    fetchStock(i, ticker);
    intervals[i] = setInterval(() => fetchStock(i, ticker), 5000);
  } else {
    fetchCrypto(i, sym);
    intervals[i] = setInterval(() => fetchCrypto(i, sym), 3000);
  }
}

// Restore symbols from localStorage when page loads
window.onload = function() {
  for(let i=0; i<4; i++) {
    let savedSym = localStorage.getItem(`symbol${i}`);
    if(savedSym) {
      document.getElementById(`sym${i}`).value = savedSym;
    }
    initRow(i);
  }
};

// Auto-load all rows
window.onload = function() { for(let i=0; i<4; i++) { initRow(i); } };
    
  // Check MACD Signal
  function checkMACD(symbol, prices) {
    let { macdLine, signalLine } = calculateMACD(prices);
    let lastMacd = macdLine[macdLine.length-1];
    let prevMacd = macdLine[macdLine.length-2];
    let lastSignal = signalLine[signalLine.length-1];
    let prevSignal = signalLine[signalLine.length-2];

    if(prevMacd < prevSignal && lastMacd > lastSignal) {
      sendTelegramAlert(`📈 MACD Bullish Crossover: ${symbol} | Price: ${prices[prices.length-1]}`);
    } else if(prevMacd > prevSignal && lastMacd < lastSignal) {
      sendTelegramAlert(`📉 MACD Bearish Crossover: ${symbol} | Price: ${prices[prices.length-1]}`);
    }
  }

  // Fetch Crypto Prices + Auto MACD Alert
  async function fetchCrypto(i, symbol) {
    try {
      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=50`);
      const data = await res.json();
      let closes = data.map(candle => parseFloat(candle[4])); // Close prices
      let lastPrice = closes[closes.length-1];
      document.getElementById(`price${i}`).innerText = `$ ${lastPrice.toLocaleString()}`;
      checkMACD(symbol, closes);
    } catch(e) { document.getElementById(`price${i}`).innerText = "Error"; }
  }

  // Fetch Stock Prices + Auto MACD Alert
  async function fetchStock(i, ticker) {
    try {
      const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1m&range=1d`);
      const data = await res.json();
      let closes = data.chart.result[0].indicators.quote[0].close.filter(v => v != null);
      let lastPrice = closes[closes.length-1];
      if(lastPrice) {
        document.getElementById(`price${i}`).innerText = `₹ ${lastPrice.toLocaleString('en-IN')}`;
        checkMACD(ticker, closes);
      } else {
        document.getElementById(`price${i}`).innerText = "Market Closed";
      }
    } catch(e) { document.getElementById(`price${i}`).innerText = "Error"; }
  }
  </script>
