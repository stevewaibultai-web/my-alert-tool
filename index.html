<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Alert Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0b1426; color: #fff; padding: 20px; margin: 0; }
    h2 { text-align: center; color: #38a1f3; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #1c3563; padding: 10px; text-align: center; }
    th { background: #132240; color: #8fa0c2; }
    td input { background: transparent; border: none; color: #fff; text-align: center; font-weight: bold; }
    select { background: #1b2e54; color: #fff; border: 1px solid #2d4b85; border-radius: 4px; padding: 5px; }
    .price { font-weight: bold; color: #0ecb81; }
    .config-box { background: #132240; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; padding: 10px; border-radius: 6px; width: 100%; }
    .status-text { font-size: 12px; margin-top: 5px; color: #0ecb81; }
  </style>
</head>
<body>
  <h2>Trading Alert Dashboard</h2>

  <!-- Telegram Connection -->
  <div class="config-box">
    <button onclick="testTelegram()">Test Connection</button>
    <div id="status" class="status-text"></div>
  </div>

  <!-- Price Table -->
  <table>
    <tr>
      <th>Symbol</th>
      <th>Indicator</th>
      <th>Timeframe</th>
      <th>Current Price</th>
      <th>Alert</th>
    </tr>
    <!-- Example rows -->
    <tr>
      <td><input type="text" id="sym0" value="BTCUSDT" onchange="initRow(0)"></td>
      <td><select id="ind0"><option>MACD</option></select></td>
      <td><select id="tf0"><option>1m</option><option>3m</option><option>5m</option><option>15m</option></select></td>
      <td id="price0" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(0)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym1" value="NIFTY50" onchange="initRow(1)"></td>
      <td><select id="ind1"><option>MACD</option></select></td>
      <td><select id="tf1"><option>1m</option><option>3m</option><option>5m</option><option>15m</option></select></td>
      <td id="price1" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(1)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym2" value="SENSEX" onchange="initRow(2)"></td>
      <td><select id="ind2"><option>MACD</option></select></td>
      <td><select id="tf2"><option>1m</option><option>3m</option><option>5m</option><option>15m</option></select></td>
      <td id="price2" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(2)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym3" value="CRUDEOILM" onchange="initRow(3)"></td>
      <td><select id="ind3"><option>MACD</option></select></td>
      <td><select id="tf3"><option>1m</option><option>3m</option><option>5m</option><option>15m</option></select></td>
      <td id="price3" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(3)">Send Alert</button></td>
    </tr>
    <tr>
      <td><input type="text" id="sym4" value="NATGASM" onchange="initRow(4)"></td>
      <td><select id="ind4"><option>MACD</option></select></td>
      <td><select id="tf4"><option>1m</option><option>3m</option><option>5m</option><option>15m</option></select></td>
      <td id="price4" class="price">Loading...</td>
      <td><button onclick="sendTelegramAlert(4)">Send Alert</button></td>
    </tr>
  </table>

  <script>
  const BOT_TOKEN = "8910250156 :AAFXETIQy7ILusg- -h5F E1PKg-dLFgS7hpg"; 
  const CHAT_ID = "7287275405";

  function sendTelegramAlert(msg) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`);
  }

  // Sync with Python bot via Flask API
  async function syncWithPython(symbol, timeframe) {
    await fetch("http://localhost:5000/update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol, timeframe })
    });
  }

  let intervals = {};
  function initRow(i) {
    let sym = document.getElementById(`sym${i}`).value.toUpperCase().trim();
    let tf = document.getElementById(`tf${i}`).value;

    localStorage.setItem(`symbol${i}`, sym);
    localStorage.setItem(`timeframe${i}`, tf);

    if(intervals[i]) clearInterval(intervals[i]);

    // Sync with Python bot
    syncWithPython(sym, tf);

    // Fetch price (Binance or Yahoo Finance depending on symbol)
    if(sym === "NIFTY50" || sym === "SENSEX" || sym === "CRUDEOILM" || sym === "NATGASM") {
      fetchStock(i, sym);
      intervals[i] = setInterval(() => fetchStock(i, sym), 5000);
    } else {
      fetchCrypto(i, sym, tf);
      intervals[i] = setInterval(() => fetchCrypto(i, sym, tf), 3000);
    }
  }
  </script>
</body>
</html>
