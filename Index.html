<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Trading Alert System</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0b1426; 
            color: #fff; 
            padding: 15px; 
            margin: 0;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h3 { text-align: center; color: #38a1f3; margin-bottom: 20px; font-weight: 500; }
        .config-box { 
            background: #132240; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #1c3563;
        }
        input, select, button { 
            background: #1b2e54; 
            color: #fff; 
            border: 1px solid #2d4b85; 
            padding: 10px; 
            margin: 6px 0; 
            border-radius: 6px; 
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus { border-color: #38a1f3; outline: none; }
        button { 
            background: #0088cc; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #006699; }
        
        .price-card {
            background: #132240;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #1c3563;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-card.disabled { opacity: 0.4; }
        .symbol-info { display: flex; flex-direction: column; width: 30%; }
        .symbol-name { font-weight: bold; font-size: 15px; text-transform: uppercase; padding: 4px; }
        .market-src { font-size: 11px; color: #8fa0c2; margin-top: 2px; margin-left: 4px; }
        
        .controls { display: flex; gap: 4px; width: 45%; }
        .controls select { padding: 6px; font-size: 12px; }
        .status-select { background: #2b1b34 !important; font-weight: bold; }
        .status-select.active-mode { background: #1b382b !important; color: #0ecb81; }
        
        .price-display { 
            width: 25%; 
            text-align: right; 
            font-size: 14px; 
            font-weight: bold; 
            color: #0ecb81; 
        }
        .status-text { font-size: 12px; text-align: center; margin-top: 5px; color: #0ecb81; }
    </style>
</head>
<body>

<div class="container">
    <h3>Telegram Alert Configuration</h3>

    <!-- 🤖 TELEGRAM SETUP -->
    <div class="config-box">
        <input type="text" id="botToken" placeholder="Bot Token (e.g. 123456:ABC...)">
        <input type="text" id="chatId" placeholder="Chat ID (e.g. 987654321)">
        <button onclick="testTelegram()">Test Connection</button>
        <div id="status" class="status-text"></div>
    </div>

    <h4 style="color: #8fa0c2; margin-left: 5px; margin-bottom: 10px;">Price Table</h4>

    <div id="dashboard">
        <!-- Row 0 -->
        <div class="price-card" id="card0">
            <div class="symbol-info">
                <input type="text" value="BTCUSDT" id="sym0" class="symbol-name" onchange="updateRowSource(0)">
                <span id="src0" class="market-src">Binance (Crypto)</span>
            </div>
            <div class="controls">
                <select id="ind0"><option value="MACD">MACD</option><option value="EMA">EMA</option><option value="RSI">RSI</option></select>
                <select id="tf0"><option value="15m">15m</option><option value="1m">1m</option><option value="5m">5m</option><option value="1h">1h</option></select>
                <select id="status0" class="status-select active-mode" onchange="toggleRow(0)">
                    <option value="ON">ON</option>
                    <option value="OFF">OFF</option>
                </select>
            </div>
            <div id="price0" class="price-display">Loading...</div>
        </div>

        <!-- Row 1 -->
        <div class="price-card" id="card1">
            <div class="symbol-info">
                <input type="text" value="ETHUSDT" id="sym1" class="symbol-name" onchange="updateRowSource(1)">
                <span id="src1" class="market-src">Binance (Crypto)</span>
            </div>
            <div class="controls">
                <select id="ind1"><option value="EMA">EMA</option><option value="MACD">MACD</option><option value="RSI">RSI</option></select>
                <select id="tf1"><option value="30m">30m</option><option value="1m">1m</option><option value="5m">5m</option><option value="1h">1h</option></select>
                <select id="status1" class="status-select active-mode" onchange="toggleRow(1)">
                    <option value="ON">ON</option>
                    <option value="OFF">OFF</option>
                </select>
            </div>
            <div id="price1" class="price-display">Loading...</div>
        </div>

        <!-- Row 2 -->
        <div class="price-card" id="card2">
            <div class="symbol-info">
                <input type="text" value="NSE:RELIANCE" id="sym2" class="symbol-name" onchange="updateRowSource(2)">
                <span id="src2" class="market-src">NSE India (Stock)</span>
            </div>
            <div class="controls">
                <select id="ind2"><option value="RSI">RSI</option><option value="MACD">MACD</option><option value="EMA">EMA</option></select>
                <select id="tf2"><option value="1h">1h</option><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option></select>
                <select id="status2" class="status-select active-mode" onchange="toggleRow(2)">
                    <option value="ON">ON</option>
                    <option value="OFF">OFF</option>
                </select>
            </div>
            <div id="price2" class="price-display">Loading...</div>
        </div>

        <!-- Row 3 -->
        <div class="price-card" id="card3">
            <div class="symbol-info">
                <input type="text" value="NSE:TCS" id="sym3" class="symbol-name" onchange="updateRowSource(3)">
                <span id="src3" class="market-src">NSE India (Stock)</span>
            </div>
            <div class="controls">
                <select id="ind3"><option value="MACD">MACD</option><option value="EMA">EMA</option><option value="RSI">RSI</option></select>
                <select id="tf3"><option value="4h">4h</option><option value="1m">1m</option><option value="5m">5m</option><option value="1d">1d</option></select>
                <select id="status3" class="status-select active-mode" onchange="toggleRow(3)">
                    <option value="ON">ON</option>
                    <option value="OFF">OFF</option>
                </select>
            </div>
            <div id="price3" class="price-display">Loading...</div>
        </div>
    </div>
</div>

<script>
    let lastAlertedState = {};

    // অন/অফ সুইচ কন্ট্রোল ফাংশন
    function toggleRow(i) {
        const statusBox = document.getElementById(`status${i}`);
        const card = document.getElementById(`card${i}`);
        if(statusBox.value === "OFF") {
            card.classList.add("disabled");
            statusBox.classList.remove("active-mode");
            document.getElementById(`price${i}`).innerText = "OFF";
        } else {
            card.classList.remove("disabled");
            statusBox.classList.add("active-mode");
            document.getElementById(`price${i}`).innerText = "Loading...";
            fetchMarketData(i);
        }
    }

    function updateRowSource(i) {
        const sym = document.getElementById(`sym${i}`).value.toUpperCase().trim();
        const srcLabel = document.getElementById(`src${i}`);
        if(sym.startsWith("NSE:")) srcLabel.innerText = "NSE India (Stock)";
        else if(sym.startsWith("BSE:")) srcLabel.innerText = "BSE India (Stock)";
        else srcLabel.innerText = "Binance (Crypto)";
        
        if(document.getElementById(`status${i}`).value === "ON") fetchMarketData(i);
    }

    async function fetchMarketData(rowIndex) {
        if(document.getElementById(`status${rowIndex}`).value === "OFF") return;

        let symbol = document.getElementById(`sym${rowIndex}`).value.toUpperCase().trim();
        const indicator = document.getElementById(`ind${rowIndex}`).value;
        const timeframe = document.getElementById(`tf${rowIndex}`).value;
        if(!symbol) return;

        let tvSymbol = symbol.includes(":") ? symbol : `BINANCE:${symbol}`;
        let tvInterval = timeframe === "1d" ? "D" : timeframe;

        try {
            const response = await fetch("https://tradingview.com", {
                method: "POST",
                body: JSON.stringify({
                    "symbols": { "tickers": [tvSymbol], "query": { "types": [] } },
                    "columns": ["close", "RSI", "MACD.macd", "MACD.signal", "EMA20", "EMA50"]
                })
            });
            
            const result = await response.json();
            if (result.data && result.data.length > 0) {
                const values = result.data.d;
                const currentPrice = values;
                const rsiVal = values;
                const macdMain = values;
                const macdSignal = values;
                const ema20 = values;
                const ema50 = values;

                let currencySign = symbol.includes("NSE") || symbol.includes("BSE") ? "₹" : "$";
                document.getElementById(`price${rowIndex}`).innerText = `${currencySign} ${parseFloat(currentPrice).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
